# The checks of the README («Files») on every pull request and every push to main: the server (format,
# lints, tests), the logic of shared/, the site in headless Chrome and the Docker image.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The server
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - name: cargo fmt
        run: cargo fmt --manifest-path server/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path server/Cargo.toml --locked

      # shared/ and the site: tasak build generates what the pages load (config.js, favicon.svg, shared/)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: node --test
        run: node --test 'shared/test/*.test.js'
      - name: tasak build
        run: |
          cp .env.example .env
          cargo build --manifest-path server/Cargo.toml --locked
          server/target/debug/tasak build
      - name: The site in headless Chrome
        run: |
          # The runner's Chrome can't use its sandbox there (unprivileged user namespaces)
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          export CHROME="$RUNNER_TEMP/chrome"
          node tools/reference.mjs
          node tools/snapshot.mjs

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build -t tasak .
      - name: The image starts and serves the site
        run: |
          cp .env.example .env
          docker run -d --name tasak -p 127.0.0.1:8765:8765 -e ARCHIVE=false \
            -v "$PWD/.env:/app/.env:ro" tasak
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          docker logs tasak
          curl -fsS http://127.0.0.1:8765/ | grep -q '<title'
          curl -fsS http://127.0.0.1:8765/config.js | grep -q TASAK_CONFIG
